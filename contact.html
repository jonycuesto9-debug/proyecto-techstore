<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">⚡ TechStore</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="about.html">Acerca de</a></li>
                <li><a href="catalog.html">Catálogo</a></li>
                <li><a href="contact.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="form-container">
            <h1>Contáctanos</h1>
            <form id="contactForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" rows="4" required minlength="10"></textarea>
                </div>
                <button type="submit" class="btn" style="width:100%;">Enviar Mensaje</button>
            </form>
        </div>
    </main>
    <footer><p>&copy; 2026 TechStore. Proyecto Final - Diseño Web I.</p></footer>
</body>
</html>
